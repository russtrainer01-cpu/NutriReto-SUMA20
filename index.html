<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriReto · SUMA20</title>
<style>
  :root{
    --green:#3f6b3f;
    --green-dark:#27500a;
    --pink:#c2186b;
    --pink-dark:#72243e;
    --cream:#ffffff;
    --card:#ffffff;
    --border:#e5e0d0;
    --text:#2b2520;
    --text-muted:#8a8078;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--cream);
    color:var(--text);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    padding:20px 16px 60px;
    min-height:100vh;
  }
  .hidden{display:none;}
  .brand-header{
    text-align:center;
    margin-bottom:18px;
  }
  .brand-kicker{
    font-size:11px;
    letter-spacing:3px;
    color:var(--green);
    font-weight:500;
  }
  .brand-title{
    font-size:26px;
    font-weight:700;
    color:var(--pink);
    line-height:1.1;
  }
  h1{font-size:20px; font-weight:700; margin:6px 0;}
  h2{font-size:15px; font-weight:700; margin:18px 0 8px;}
  p.sub{color:var(--text-muted); font-size:13px; margin:4px 0 14px; line-height:1.5;}
  label{display:block; font-size:12px; font-weight:500; color:var(--text-muted); margin:10px 0 4px;}
  input[type="text"], input[type="date"], input[type="number"], textarea{
    width:100%;
    background:#faf8f2;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px 12px;
    font-size:14px;
    color:var(--text);
    font-family:inherit;
  }
  .btn-primary{
    width:100%;
    background:linear-gradient(90deg, var(--green), var(--pink));
    color:#fff;
    border:none;
    border-radius:10px;
    padding:13px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
  }
  .btn-primary:active{opacity:0.85;}
  .btn-ghost{
    width:100%;
    background:var(--card);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:11px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--pink);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    padding:0;

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
  }
  .error{
    color:#a32d2d;
    font-size:12px;
    margin-top:6px;

    color:var(--text);
    text-align:left;
    margin-bottom:14px;
  }
  #signature-pad{
    border:2px dashed var(--pink);
    border-radius:12px;
    width:100%;
    height:120px;
    touch-action:none;
    background:#fff;
  }
  .signature-hint{
    font-size:11px;
    color:var(--pink-dark);
    text-align:center;
    margin:6px 0 14px;
  }
  #confetti-overlay{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:999;
  }

  .progress-card{

    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;

  .progress-row{

    justify-content:space-between;
    align-items:baseline;
    margin-bottom:8px;
  }
  .progress-track{
    background:#f0ece0;
    border-radius:20px;
    height:10px;
    overflow:hidden;
  }
  .progress-fill{
    background:linear-gradient(90deg, var(--green), var(--pink));
    height:100%;
    border-radius:20px;
    transition:width 0.4s ease;
  }
  .community-banner{
    background:#fff;
    border:1px solid var(--border);
    border-left:3px solid var(--green);
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;

  .community-banner .num{font-size:14px; font-weight:700; color:var(--green-dark);}

    border:1px solid var(--border);
    border-left:4px solid var(--pink);

    padding:16px 18px;
    margin-bottom:14px;
    font-size:15px;
    font-weight:600;
    color:var(--text);
    line-height:1.6;

  .frase-motivacional{

    padding:14px 16px;
    margin-bottom:14px;
    font-size:13px;
    font-style:italic;
    color:#2d4a1a;
    line-height:1.5;
    text-align:center;
  }
  .nutri-progress-wrap{
    position:fixed;
    top:0;
    left:50%;
    transform:translateX(-50%);
    width:100%;
    max-width:440px;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    gap:4px;
    background:var(--bg);
    padding:12px 20px 10px;
    z-index:50;
    box-shadow:0 2px 8px rgba(43,37,33,0.1);

  .nutri-progress-label{
    font-size:12px;
    font-weight:800;
    color:var(--text-muted);
    letter-spacing:0.03em;

  .nutri-progress-row{

    align-items:center;
    gap:10px;

  .nutri-progress-track{

    border-radius:10px;

    background:linear-gradient(90deg, #d64545, #e0a52c, #4caf6d);
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.15);

  .nutri-progress-mask{
    position:absolute;
    top:0; right:0; bottom:0;
    background:var(--bg);
    transition:width 0.4s ease;
  }
  .nutri-progress-pct{
    font-size:15px;
    font-weight:800;
    color:var(--text);
    min-width:40px;
    text-align:right;

    border:none;
    cursor:pointer;
    font-family:inherit;
    padding:0;
    display:flex;
    align-items:center;
    gap:8px;
    margin:18px 0 8px;
    font-size:14px;
    font-weight:700;
    color:var(--text);

    font-weight:700;

    display:grid;

    gap:7px;
  }
  .day-chip{
    border-radius:10px;
    padding:8px 6px;
    text-align:center;
    cursor:pointer;
    border:none;
    font-family:inherit;
  }
  .day-chip.fuerza{ background:#fff; border:1px solid var(--border); border-left:3px solid var(--pink); }
  .day-chip.cardio{ background:#fff; border:1px solid var(--border); border-left:3px solid var(--green); }
  .day-chip.elongacion{ background:#fff; border:1px solid var(--border); border-left:3px solid #378add; }
  .day-chip.amorpropio{ background:#fff; border:1px solid var(--border); border-left:3px solid #ef9f27; }
  .day-chip.reflexion{ background:#fff; border:1px solid var(--border); border-left:3px solid #7f77dd; }
  .day-chip.cierre{ background:linear-gradient(135deg, var(--green), var(--pink)); }
  .day-chip.cierre .dc-label, .day-chip.cierre .dc-sub{ color:#fff; }
  .day-chip.done{
    background:#ececec !important;
    border-left:4px solid #c2c2c2 !important;
    opacity:1;
  }
  .day-chip.done .dc-label{ text-decoration:line-through; color:#9c9c9c; }
  .day-chip.today{ outline:2px solid var(--pink); }
  .dc-label{ font-size:12px; font-weight:700; }
  .dc-sub{ font-size:10px; color:var(--text-muted); margin-top:2px; }
  .day-chip.fuerza .dc-sub{ color:var(--pink-dark); }
  .day-chip.cardio .dc-sub{ color:var(--green-dark); }
  .sos-btn{
    width:100%;
    background:#faeeda;
    border:2px solid #ef9f27;
    border-radius:14px;
    padding:14px 16px;
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    font-family:inherit;
    text-align:left;
  }
  .sos-title{ font-size:13px; font-weight:700; color:#633806; }
  .sos-sub{ font-size:11px; color:#854f0b; }
  .badge-list{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .badge-item{
    text-align:center;
    font-size:9px;
    color:var(--text-muted);
  }
  .badge-item .ic{ font-size:22px; display:block; opacity:0.35; }
  .badge-item.earned .ic{ opacity:1; }

    display:flex;
    align-items:center;
    gap:14px;
    margin:10px 0;
  }
  .set-counter button{
    width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border);
    background:#faf8f2;
    font-size:16px; font-weight:700;
    cursor:pointer;
  }
  .feeling-row{
    display:flex;
    gap:8px;
    margin:10px 0;
  }
  .feeling-btn{
    flex:1;
    background:#faf8f2;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px 0;
    font-size:18px;
    cursor:pointer;
  }
  .feeling-btn.selected{
    border-color:var(--pink);
    background:#fbeaf0;
  }
  .video-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff;
    border:1px solid var(--pink);
    color:var(--pink);
    font-weight:500;
    font-size:13px;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-family:inherit;
    margin:0 0 10px;
  }
  .video-embed-wrap{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:10px;
    overflow:hidden;
    margin:0 0 10px;
    background:#000;
  }
  .video-embed-wrap iframe{
    position:absolute;
    top:0; left:0;
    width:100%;
    height:100%;
    border:none;
  }
  .sos-player{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:14px;
    overflow:hidden;
    background:linear-gradient(135deg, var(--green) 0%, #2c4a2c 45%, var(--pink-dark) 100%);
    margin-top:14px;
  }
  .sos-player-badge{
    position:absolute;
    top:10px; left:10px;
    background:rgba(0,0,0,0.45);
    color:#fff;
    font-size:10px;
    font-weight:700;
    padding:4px 9px;
    border-radius:20px;
    letter-spacing:0.03em;
  }
  .sos-play-btn{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:60px; height:60px;
    border-radius:50%;
    background:rgba(255,255,255,0.95);
    border:none;
    color:var(--pink-dark);
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(0,0,0,0.35);
  }
  .sos-player-info{
    position:absolute;
    bottom:0; left:0; right:0;
    background:linear-gradient(0deg, rgba(0,0,0,0.6), transparent);
    padding:24px 14px 10px;
    text-align:left;
  }
  .sos-player-title{
    color:#fff;
    font-weight:700;
    font-size:13px;
  }
  .sos-player-sub{
    color:rgba(255,255,255,0.85);
    font-size:11px;
    margin-top:2px;
  }
  .rest-active{
    background:#ff8c1a;
    color:#2b1400;
    font-weight:700;
    text-align:center;
    border-radius:10px;
    padding:10px;
    margin:8px 0;
    animation:restPulse 1.4s ease-in-out infinite;
  }
  .rest-start-btn{
    background:#fff !important;
    color:var(--pink) !important;
    border:2px solid var(--pink) !important;
    font-weight:700;
    animation:restPulse 1.4s ease-in-out infinite;
  }
  @keyframes restPulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.75; }
  }
  .rest-overlay{
    position:fixed;
    inset:0;
    background:rgba(10,10,10,0.92);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:30px 20px;
    z-index:99;
  }
  .rest-overlay-label{
    color:#fff;
    opacity:0.7;
    font-size:15px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    margin-bottom:8px;
  }
  .rest-overlay-time{
    color:#fff;
    font-size:clamp(56px, 18vw, 96px);
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
  }
  @keyframes blinkOverlayNr{
    0%, 49%{ opacity:1; color:#fff; }
    50%, 100%{ opacity:1; color:var(--pink); }
  }
  .rest-overlay.blinking .rest-overlay-time{
    animation: blinkOverlayNr 0.5s steps(1) infinite;
  }
  .rest-overlay-cancel{
    margin-top:28px;
    background:none;
    border:1px solid rgba(255,255,255,0.3);
    color:#fff;
    border-radius:20px;
    padding:10px 22px;
    font-size:13px;
    cursor:pointer;
  }
  .rest-alert-banner{
    background:#ff8c1a;
    color:#2b1400;
    font-weight:700;
    font-size:15px;
    padding:14px 16px;
    border-radius:10px;
    margin:0 0 14px;
    text-align:center;
    box-shadow:0 2px 10px rgba(255,140,26,0.45);
  }
  .admin-stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:18px;
  }
  .admin-stat-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    text-align:center;
  }
  .admin-stat-num{
    font-size:24px;
    font-weight:700;
    color:var(--pink);
  }
  .admin-stat-label{
    font-size:10px;
    font-weight:500;
    color:var(--text-muted);
    margin-top:2px;
  }

    font-weight:700;
    margin:22px 0 10px;
    display:flex;
    align-items:center;
    gap:8px;

    background:var(--card);
    border:1px solid var(--border);

    padding:12px 14px;
    margin-bottom:8px;

  .admin-progress-mini{

    border-radius:20px;
    height:6px;

    margin-top:6px;
  }
  .admin-progress-mini-fill{
    background:linear-gradient(90deg, var(--green), var(--pink));

    margin:10px auto 0;

  .share-card-kicker{

  }
  .share-card-title{
    font-size:18px;
    font-weight:700;
    color:var(--pink);
    margin-bottom:24px;
  }
  .share-card-sub{

    color:#5c564c;
  }
  .share-card-day{
    font-size:52px;
    font-weight:700;
    color:#2b2520;
    line-height:1;
  }
  .share-card-of{
    font-size:13px;
    color:#5c564c;
    margin-bottom:20px;
  }
  .share-card-progress-track{
    background:#fff;

    height:12px;
    overflow:hidden;
    margin-bottom:10px;
  }
  .share-card-progress-fill{
    background:linear-gradient(90deg, var(--green), var(--pink));
    height:100%;
    border-radius:20px;
  }
  .share-card-hito{
    font-size:12px;
    font-weight:500;
    color:var(--green);
    margin-bottom:16px;
  }
  .share-card-quote{
    font-size:12px;
    color:#5c564c;
    font-style:italic;
    line-height:1.5;
    margin-bottom:20px;
  }
  .share-card-tags{
    font-size:10px;
    color:#9a9488;
  }
  .photos-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
  }
  .photo-cell{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    text-align:center;
  }
  .photo-cell img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    border-radius:8px;
    cursor:pointer;
  }
  .photo-add-btn{
    aspect-ratio:3/4;
    border:2px dashed var(--border);
    border-radius:8px;

    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;

  .photos-compare{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .photos-compare img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    border-radius:10px;
  }
  .admin-comment-box{
    background:#fff;
    border-left:3px solid var(--pink);
    border-radius:8px;
    padding:10px 12px;
    font-size:12px;
    margin-top:6px;
    color:var(--text);
  }
  .tip{
    background:#faf8f2;
    border-left:3px solid var(--pink);
    border-radius:8px;
    padding:10px 12px;
    font-size:12px;
    margin:8px 0;
    color:var(--text);
  }
  .empty{ color:var(--text-muted); font-size:13px; text-align:center; padding:20px 0; }
  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:16px;
  }
  .back{
    background:#faf8f2;
    border:1px solid var(--border);
    color:var(--pink-dark);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    padding:9px 16px;
    border-radius:10px;
    margin-bottom:14px;
  }
</style>

function getFraseForDay(dayNum){
  const info = dayInfo(dayNum);
  const isRestDay = info.tipo === 'amorpropio' || info.tipo === 'reflexion' || info.tipo === 'cierre';
  const isStretchDay = info.tipo === 'elongacion';
  const isCardioDay = info.tipo === 'cardio';
  if(isRestDay){
    const opciones = FRASES_DIA.filter(f=>f.tipo==='descanso');
    if(opciones.length) return opciones[dayNum % opciones.length].texto;
  }
  if(isStretchDay){
    const opciones = FRASES_DIA.filter(f=>f.tipo==='elongacion');
    if(opciones.length) return opciones[dayNum % opciones.length].texto;
  }
  if(isCardioDay){
    const opciones = FRASES_DIA.filter(f=>f.tipo==='cardio');
    if(opciones.length) return opciones[dayNum % opciones.length].texto;
  }
  const generales = FRASES_DIA.filter(f=>!f.tipo);
  return generales[(dayNum-1) % generales.length].texto;
}

async function ensureRestAudio(){
  if(!restAudioCtx){
    try{ restAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  try{ await restAudioCtx.resume(); }catch(e){}
  return restAudioCtx;
}
function firstNumberSecs(str){
  const m = String(str).match(/\d+/);
  return m ? Number(m[0]) : 30;
}
let silentOscillators = {};
function startSilentKeepAlive(key){
  ensureRestAudio().then(ctx=>{
    if(!ctx) return;
    try{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 20;
      gain.gain.value = 0.0005;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      silentOscillators[key] = osc;
    }catch(e){}
  });
}
function stopSilentKeepAlive(key){
  if(silentOscillators[key]){
    try{ silentOscillators[key].stop(); }catch(e){}
    delete silentOscillators[key];
  }
}
let restFinishedCallbacks = {};
function startRestTimer(key, seconds){
  ensureRestAudio();
  startSilentKeepAlive(key);
  const current = state.uiSets[key] !== undefined ? state.uiSets[key] : 0;
  state.uiSets[key] = current + 1;
  if(restTimerHandles[key]) clearInterval(restTimerHandles[key]);
  restTimerEndTimes[key] = Date.now() + seconds*1000;
  state.uiResting[key] = seconds;
  render();
  restTimerHandles[key] = setInterval(()=> tickRestTimer(key), 1000);
}
function startCircuitRest(key, seconds, callback){
  restFinishedCallbacks[key] = callback;
  ensureRestAudio();
  startSilentKeepAlive(key);
  if(restTimerHandles[key]) clearInterval(restTimerHandles[key]);
  restTimerEndTimes[key] = Date.now() + seconds*1000;
  state.uiResting[key] = seconds;
  render();
  restTimerHandles[key] = setInterval(()=> tickRestTimer(key), 1000);
}
function cancelRestTimer(key){
  if(restTimerHandles[key]) clearInterval(restTimerHandles[key]);
  delete restTimerHandles[key];
  delete restTimerEndTimes[key];
  delete state.uiResting[key];
  stopSilentKeepAlive(key);
  render();
}
function tickRestTimer(key){
  const remaining = Math.max(0, Math.round((restTimerEndTimes[key] - Date.now())/1000));
  state.uiResting[key] = remaining;
  if(remaining > 0 && remaining <= 10) playTickSoundNr();
  if(remaining <= 0){
    clearInterval(restTimerHandles[key]);
    delete restTimerHandles[key];
    delete restTimerEndTimes[key];
    delete state.uiResting[key];
    onRestFinished(key);
  } else {

  return msg.replace('{nombre}', state.nombre.split(' ')[0]);
}
function playTickSoundNr(){
  try{
    ensureRestAudio().then(ctx=>{
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1000;
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
      gain.gain.linearRampToValueAtTime(0, now + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    });
  }catch(e){}
}
async function onRestFinished(key){
  stopSilentKeepAlive(key);
  try{
    const ctx = await ensureRestAudio();
    if(ctx){
      const now = ctx.currentTime;
      // Silbato de partido: tono agudo sostenido con vibrato
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 2200;
      lfo.frequency.value = 18;
      lfoGain.gain.value = 40;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
      gain.gain.setValueAtTime(0.5, now + 0.35);
      gain.gain.linearRampToValueAtTime(0, now + 0.42);
      gain.gain.setValueAtTime(0.5, now + 0.5);
      gain.gain.linearRampToValueAtTime(0, now + 0.85);
      osc.connect(gain);
      gain.connect(ctx.destination);
      lfo.start(now);
      osc.start(now);
      osc.stop(now + 0.9);
      lfo.stop(now + 0.9);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([250,100,250]);
  document.querySelectorAll('.rest-overlay').forEach(el=> el.remove());
  if(restFinishedCallbacks[key]){
    const cb = restFinishedCallbacks[key];
    delete restFinishedCallbacks[key];
    cb();
    return;
  }
  state.uiRestAlert = { key, message: getRestMessage() };
  render();
  setTimeout(()=>{
    if(state.uiRestAlert && state.uiRestAlert.key === key){
      state.uiRestAlert = null;
      render();
    }
  }, 6000);
}
function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const shortsMatch = url.match(/\/shorts\/([^?&]+)/);
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortLinkMatch = url.match(/youtu\.be\/([^?&]+)/);
  if(shortsMatch) id = shortsMatch[1];
  else if(watchMatch) id = watchMatch[1];
  else if(shortLinkMatch) id = shortLinkMatch[1];
  return id ? `https://www.youtube.com/embed/${id}?playsinline=1&rel=0&modestbranding=1` : null;
}
let magicAudioCtx = null;
async function playMagicSound(){
  try{
    if(!magicAudioCtx){
      magicAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(magicAudioCtx.state === 'suspended'){
      await magicAudioCtx.resume();
    }
    const ctx = magicAudioCtx;
    const notes = [783.99, 987.77, 1174.66, 1567.98]; // G5, B5, D6, G6 — arpegio brillante
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.07;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  }catch(e){}
}

  }catch(e){}

}
function normalizeData(d){
  if(!d.exercises) d.exercises = {};
  if(!d.completados) d.completados = {};
  if(!d.compromisoFirmado) d.compromisoFirmado = false;
  if(!d.badges) d.badges = [];
  if(!d.photos) d.photos = {};
  if(!d.photosShared) d.photosShared = {};
  if(d.modelo === undefined) d.modelo = null;
  return d;
}
function compressImage(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = Math.round(h * maxSize/w); w = maxSize; }
        else if(h > maxSize){ w = Math.round(w * maxSize/h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function countTodayActive(codigo){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/nutrireto_participantes?codigo=eq.${encodeURIComponent(codigo.trim().toLowerCase())}&select=data`, {
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}` }
    });
    const rows = await res.json();
    const today = todayISO();
    let count = 0;
    rows.forEach(r=>{
      const ex = (r.data && r.data.exercises) || {};
      const hasToday = Object.keys(ex).some(k => ex[k].some(e=>e.date === today));
      if(hasToday) count++;
    });
    return count;
  }catch(e){ return 0; }
}

function daysSinceISO(dateStr){
  if(!dateStr) return null;
  const d1 = new Date(dateStr);
  const d2 = new Date(todayISO());
  return Math.round((d2 - d1) / 86400000);
}

function dayInfo(dayNum, modelo){
  const m = modelo || (state.data && state.data.modelo) || 'casa';
  const arr = m === 'gym' ? NUTRIRETO_DAYS_GYM : NUTRIRETO_DAYS_CASA;
  return arr.find(d=>d.day === dayNum);
}
function computeDayProgressPct(data, dayNum, items){
  if(!items.length) return 0;
  const isItemDone = (item, idx)=>{
    if(item.tipo === 'circuito'){
      const doneKey = dayNum + ':circuito' + idx + ':completo';
      return (data.exercises[doneKey] || []).length > 0;
    }
    const entries = data.exercises[dayNum + ':' + item.ejercicio] || [];
    return entries.length > 0;
  };
  const regulares = items.filter(it=> !it.esOpcion);
  const opciones = items.filter(it=> it.esOpcion);
  const total = regulares.length + (opciones.length ? 1 : 0);
  if(!total) return 0;
  let done = 0;
  regulares.forEach((item)=>{ if(isItemDone(item, items.indexOf(item))) done++; });
  if(opciones.length && opciones.some((item)=> isItemDone(item, items.indexOf(item)))) done++;
  return Math.round((done/total)*100);
}
function isDayDone(data, dayNum){
  const d = dayInfo(dayNum, data.modelo);
  if(!d) return false;
  if(d.tipo === 'amorpropio' || d.tipo === 'reflexion' || d.tipo === 'cierre'){
    return !!(data.completados['dia'+dayNum] && data.completados['dia'+dayNum].done);
  }
  if(d.items.length === 0) return false;
  const opciones = d.items.filter(it=> it.esOpcion);
  const regulares = d.items.filter(it=> !it.esOpcion);
  const isItemDone = (item, idx)=>{
    if(item.tipo === 'circuito'){
      const doneKey = dayNum + ':circuito' + idx + ':completo';
      return (data.exercises[doneKey] || []).length > 0;
    }
    const entries = data.exercises[dayNum + ':' + item.ejercicio] || [];
    return entries.length > 0;
  };
  const regularesOk = regulares.every((item)=> isItemDone(item, d.items.indexOf(item)));
  const opcionesOk = opciones.length === 0 || opciones.some((item)=> isItemDone(item, d.items.indexOf(item)));
  return regularesOk && opcionesOk;
}
function completedCount(data){
  let n = 0;
  for(let i=1;i<=30;i++) if(isDayDone(data, i)) n++;
  return n;
}
function currentDayNum(data){
  for(let i=1;i<=30;i++) if(!isDayDone(data, i)) return i;
  return 30;
}

          card.innerHTML = `
            <div style="font-weight:700; font-size:18px; color:var(--pink); margin-bottom:2px;">${escapeHtml(item.ejercicio)}</div>
            <div class="sub" style="margin:2px 0 10px;">${escapeHtml(item.reps)}</div>
            ${item.video ? `
              <button class="video-btn" data-videotoggle="${key}">🎥 ${state.uiVideoOpen[key] ? 'Ocultar técnica' : 'Ver técnica'}</button>
              ${state.uiVideoOpen[key] ? `<div class="video-embed-wrap"><iframe src="${escapeHtml(youtubeEmbedUrl(item.video))}" allow="encrypted-media"></iframe></div>` : ''}
            ` : ''}
            ${item.nota ? `<div class="tip">💡 ${escapeHtml(item.nota)}</div>` : ''}
            <button class="btn-ghost checklist-done-btn" data-key="${key}" data-exercise="${escapeHtml(item.ejercicio)}" data-reps="${escapeHtml(item.reps)}" data-recordatorio="${escapeHtml(item.recordatorio || '')}" style="margin-top:8px; text-align:left;">☐ &nbsp;Lo completé</button>
          `;
        }
        wrap.appendChild(card);
        return;
      }

      const setsTarget = (item.series.match(/\d+/) || [null])[0];
      const setsDone = state.uiSets[key] !== undefined ? state.uiSets[key] : 0;
      const selectedFeeling = state.uiFeeling[key];

      const card = document.createElement('div');
      card.className = 'card';
      if(lastToday){
        card.innerHTML = `
          <div style="font-weight:700; font-size:18px; color:var(--pink); margin-bottom:2px;">${escapeHtml(item.ejercicio)}</div>
          <div class="sub" style="margin:4px 0 0;">✓ Ya registrado hoy — ${lastToday.reps} × ${lastToday.sets}${lastToday.feeling ? ' · ' + lastToday.feeling : ''}</div>
        `;
      } else {
        const resting = state.uiResting[key];
        card.innerHTML = `
          <div style="font-weight:700; font-size:18px; color:var(--pink); margin-bottom:2px;">${escapeHtml(item.ejercicio)}</div>
          <div class="sub" style="margin:2px 0 10px;">Objetivo: ${escapeHtml(item.series)} × ${escapeHtml(item.reps)} · ${escapeHtml(item.peso)}</div>
          ${item.video ? `
            <button class="video-btn" data-videotoggle="${key}">🎥 ${state.uiVideoOpen[key] ? 'Ocultar técnica' : 'Ver técnica'}</button>
            ${state.uiVideoOpen[key] ? `<div class="video-embed-wrap"><iframe src="${escapeHtml(youtubeEmbedUrl(item.video))}" allow="encrypted-media"></iframe></div>` : ''}
          ` : ''}
          ${item.nota ? `<div class="tip">💡 <strong>Consejo técnico:</strong> ${escapeHtml(item.nota)}</div>` : ''}
          <div class="set-counter">
            <button class="set-minus" data-key="${key}">−</button>
            <span>${setsDone}${setsTarget ? ' / ' + setsTarget : ''} series</span>
            <button class="set-plus" data-key="${key}">+</button>
          </div>
          ${item.descanso ? (
            resting !== undefined ? '' : `
              <button class="btn-ghost rest-start-btn" data-key="${key}" data-seconds="${firstNumberSecs(item.descanso)}">⏱️ Iniciar descanso (${escapeHtml(item.descanso)})</button>
            `
          ) : ''}
          <div class="feeling-row">
            ${FEELINGS.map(f=>`<button class="feeling-btn${selectedFeeling===f?' selected':''}" data-key="${key}" data-feeling="${f}">${f}</button>`).join('')}
          </div>
          <label style="display:block; font-size:11px; font-weight:500; color:var(--text-muted); margin:8px 0 4px;">📝 Nota para tu entrenadora (opcional)</label>
          <input type="text" id="comment-${key}" value="${escapeHtml(state.uiComment[key] || '')}" placeholder="Ej: me costó, ¿bajo el peso?" />
          <button class="btn-primary registrar-btn" data-key="${key}" data-exercise="${escapeHtml(item.ejercicio)}" data-reps="${escapeHtml(item.reps)}" data-target="${setsTarget || ''}" style="margin-top:8px;">Registrar</button>
        `;
      }
      wrap.appendChild(card);
    });

    wrap.querySelectorAll('.rest-start-btn').forEach(btn=>{
      btn.onclick = ()=>{ startRestTimer(btn.dataset.key, Number(btn.dataset.seconds)); };
    });
    wrap.querySelectorAll('[data-videotoggle]').forEach(btn=>{
      btn.onclick = ()=>{
        const k = btn.dataset.videotoggle;
        if(state.uiVideoOpen[k]) delete state.uiVideoOpen[k];
        else state.uiVideoOpen[k] = true;
        render();
      };
    });
    wrap.querySelectorAll('.set-plus').forEach(btn=>{
      btn.onclick = ()=>{ const k=btn.dataset.key; state.uiSets[k]=(state.uiSets[k]||0)+1; render(); };
    });
    wrap.querySelectorAll('.set-minus').forEach(btn=>{
      btn.onclick = ()=>{ const k=btn.dataset.key; state.uiSets[k]=Math.max(0,(state.uiSets[k]||0)-1); render(); };
    });
    wrap.querySelectorAll('.feeling-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.uiFeeling[btn.dataset.key]=btn.dataset.feeling; render(); };
    });
    wrap.querySelectorAll('[id^=comment-]').forEach(inp=>{
      inp.oninput = ()=>{ state.uiComment[inp.id.replace('comment-','')] = inp.value; };
    });
    wrap.querySelectorAll('.circuit-register-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const circuitKey = btn.dataset.circuitkey;
        const dayIdx = Number(btn.dataset.dayidx);
        const item = info.items[dayIdx];
        const cState = state.uiCircuit[circuitKey];
        const currentEx = item.ejercicios[cState.exIdx];
        const exEntryKey = circuitKey + ':' + currentEx.ejercicio;
        const entry = { date: todayISO(), ts: new Date().toISOString(), reps: currentEx.reps, ronda: cState.round };
        if(!data.exercises[exEntryKey]) data.exercises[exEntryKey] = [];
        data.exercises[exEntryKey].push(entry);
        await saveParticipante(state.codigo, state.nombre, data);

        const isLastExInRound = cState.exIdx >= item.ejercicios.length - 1;
        const isLastRound = cState.round >= item.rondas;

        if(isLastExInRound && isLastRound){
          const doneKey = btn.dataset.donekey;
          if(!data.exercises[doneKey]) data.exercises[doneKey] = [];
          data.exercises[doneKey].push({ date: todayISO(), ts: new Date().toISOString() });
          await saveParticipante(state.codigo, state.nombre, data);
          if(isDayDone(data, d)){ state.view = 'day-complete'; render(); return; }
          render();
        } else if(isLastExInRound){
          startCircuitRest(circuitKey, 60, ()=>{
            cState.round++;
            cState.exIdx = 0;
            render();
          });
        } else {
          startCircuitRest(circuitKey, 15, ()=>{
            cState.exIdx++;
            render();
          });
        }
      };
    });
    wrap.querySelectorAll('.checklist-done-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const key = btn.dataset.key;
        const entry = { date: todayISO(), ts: new Date().toISOString(), reps: btn.dataset.reps, sets: 1, feeling: '' };
        if(!data.exercises[key]) data.exercises[key] = [];
        data.exercises[key].push(entry);
        await saveParticipante(state.codigo, state.nombre, data);
        if(isDayDone(data, d)){ state.view = 'day-complete'; render(); return; }
        if(btn.dataset.recordatorio){
          state.uiRestAlert = { key: 'reminder-' + key, message: btn.dataset.recordatorio };
          setTimeout(()=>{
            if(state.uiRestAlert && state.uiRestAlert.key === 'reminder-' + key){
              state.uiRestAlert = null;
              render();
            }
          }, 6000);
        }
        render();
      };
    });
    wrap.querySelectorAll('.registrar-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const key = btn.dataset.key;
        const target = Number(btn.dataset.target) || 0;
        const trackedSets = state.uiSets[key] || 0;
        const finalSets = target ? Math.max(trackedSets, target) : trackedSets;
        const entry = { date: todayISO(), ts: new Date().toISOString(), reps: btn.dataset.reps, sets: finalSets, feeling: state.uiFeeling[key]||'' };
        if(state.uiComment[key] && state.uiComment[key].trim()) entry.comment = state.uiComment[key].trim();
        if(!data.exercises[key]) data.exercises[key] = [];
        data.exercises[key].push(entry);
        delete state.uiSets[key];
        delete state.uiFeeling[key];
        delete state.uiComment[key];
        await saveParticipante(state.codigo, state.nombre, data);
        if(isDayDone(data, d)){ state.view = 'day-complete'; }
        render();
      };
    });
    return;
  }
}

async function onLogin(){
  const codigo = document.getElementById('in-codigo').value.trim();
  const nombre = document.getElementById('in-nombre').value.trim();
  const err = document.getElementById('login-error');
  if(!codigo || !nombre){
    err.textContent = 'Completá el código y tu nombre.';
    err.classList.remove('hidden');
    return;
  }
  if(nombre.toLowerCase() === 'panelruss'){
    err.classList.add('hidden');
    state.view = 'admin-loading';
    render();
    await loadAdminData();
    state.view = 'admin-panel';
    render();
    return;
  }
  if(codigo.toUpperCase() !== ACCESS_CODE.toUpperCase()){
    err.textContent = 'Código incorrecto. Revisá con tu entrenadora.';
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  state.codigo = codigo;
  state.nombre = nombre;
  state.data = await loadParticipante(codigo, nombre);
  state.view = !state.data.compromisoFirmado ? 'compromiso' : (state.data.modelo ? 'dashboard' : 'elegir-modelo');
  render();
}

function setupSignaturePad(){
  const canvas = document.getElementById('signature-pad');
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#c2186b';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  state.sigCtx = ctx;
  state.sigHasContent = false;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function start(e){ e.preventDefault(); state.sigDrawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e){
    if(!state.sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.sigHasContent = true;
  }
  function end(){ state.sigDrawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSignature(){
  const canvas = document.getElementById('signature-pad');
  const ctx = state.sigCtx;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  state.sigHasContent = false;
}
async function onConfirmCompromiso(){
  if(!state.sigHasContent){
    document.getElementById('sig-error').classList.remove('hidden');
    return;
  }
  document.getElementById('sig-error').classList.add('hidden');
  state.data.compromisoFirmado = true;
  await saveParticipante(state.codigo, state.nombre, state.data);
  fireConfetti();
  setTimeout(()=>{
    state.view = state.data.modelo ? 'dashboard' : 'elegir-modelo';
    render();
  }, 900);
}

function fireConfetti(){
  const canvas = document.getElementById('confetti-overlay');
  canvas.classList.remove('hidden');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#3f6b3f','#c2186b','#ef9f27','#f3f0e6'];
  const particles = [];
  for(let i=0;i<60;i++){
    particles.push({
      x: canvas.width/2, y: canvas.height/2,
      vx: (Math.random()-0.5)*14,
      vy: (Math.random()-0.9)*14,
      size: 4+Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 60
    });
  }
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.life--;
      ctx.globalAlpha = Math.max(p.life/60, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    if(frame < 60) requestAnimationFrame(tick);
    else canvas.classList.add('hidden');
  }
  tick();
}

render();
