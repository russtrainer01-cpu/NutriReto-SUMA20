let restTimerHandles = {};
let restTimerEndTimes = {};
let restAudioCtx = null;
async function ensureRestAudio(){
  if(!restAudioCtx){
    try{ restAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(restAudioCtx.state === 'suspended'){
    try{ await restAudioCtx.resume(); }catch(e){}
  }
  return restAudioCtx;
}
function firstNumberSecs(str){
  const m = String(str).match(/\d+/);
  return m ? Number(m[0]) : 30;
}
function startRestTimer(key, seconds){
  ensureRestAudio();
  const current = state.uiSets[key] !== undefined ? state.uiSets[key] : 0;
  state.uiSets[key] = current + 1;
  if(restTimerHandles[key]) clearInterval(restTimerHandles[key]);
  restTimerEndTimes[key] = Date.now() + seconds*1000;
  state.uiResting[key] = seconds;
  render();
  restTimerHandles[key] = setInterval(()=> tickRestTimer(key), 1000);
}
function cancelRestTimer(key){
  if(restTimerHandles[key]) clearInterval(restTimerHandles[key]);
  delete restTimerHandles[key];
  delete restTimerEndTimes[key];
  delete state.uiResting[key];
  render();
}
function tickRestTimer(key){
  const remaining = Math.max(0, Math.round((restTimerEndTimes[key] - Date.now())/1000));
  state.uiResting[key] = remaining;
  if(remaining > 0 && remaining <= 10) playTickSoundNr();
  if(remaining <= 0){
    clearInterval(restTimerHandles[key]);
    delete restTimerHandles[key];
    delete restTimerEndTimes[key];
    delete state.uiResting[key];
    onRestFinished(key);
  } else {
    render();
  }
}

function playTickSoundNr(){
  try{
    ensureRestAudio().then(ctx=>{
      if(!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1000;
      const now = ctx.currentTime;
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.15, now + 0.02);
      gain.gain.linearRampToValueAtTime(0, now + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.12);
    });
  }catch(e){}
}
async function onRestFinished(key){
  try{
    const ctx = await ensureRestAudio();
    if(ctx){
      const now = ctx.currentTime;
      // Silbato de partido: tono agudo sostenido con vibrato
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const lfo = ctx.createOscillator();
      const lfoGain = ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = 2200;
      lfo.frequency.value = 18;
      lfoGain.gain.value = 40;
      lfo.connect(lfoGain);
      lfoGain.connect(osc.frequency);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
      gain.gain.setValueAtTime(0.5, now + 0.35);
      gain.gain.linearRampToValueAtTime(0, now + 0.42);
      gain.gain.setValueAtTime(0.5, now + 0.5);
      gain.gain.linearRampToValueAtTime(0, now + 0.85);
      osc.connect(gain);
      gain.connect(ctx.destination);
      lfo.start(now);
      osc.start(now);
      osc.stop(now + 0.9);
      lfo.stop(now + 0.9);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([250,100,250]);
  document.querySelectorAll('.rest-overlay').forEach(el=> el.remove());
  state.uiRestAlert = { key, message: getRestMessage() };
  render();
  setTimeout(()=>{
    if(state.uiRestAlert && state.uiRestAlert.key === key){
      state.uiRestAlert = null;
      render();
    }
  }, 6000);
}
function youtubeEmbedUrl(url){
  if(!url) return null;
  let id = null;
  const shortsMatch = url.match(/\/shorts\/([^?&]+)/);
  const watchMatch = url.match(/[?&]v=([^&]+)/);
  const shortLinkMatch = url.match(/youtu\.be\/([^?&]+)/);
  if(shortsMatch) id = shortsMatch[1];
  else if(watchMatch) id = watchMatch[1];
  else if(shortLinkMatch) id = shortLinkMatch[1];
  return id ? `https://www.youtube.com/embed/${id}` : null;
}
let magicAudioCtx = null;
async function playMagicSound(){
  try{
    if(!magicAudioCtx){
      magicAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(magicAudioCtx.state === 'suspended'){
      await magicAudioCtx.resume();
    }
    const ctx = magicAudioCtx;
    const notes = [783.99, 987.77, 1174.66, 1567.98]; // G5, B5, D6, G6 — arpegio brillante
    notes.forEach((freq, i)=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = freq;
      const start = ctx.currentTime + i * 0.07;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.4);
    });
  }catch(e){}
}

function compressImage(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h && w > maxSize){ h = Math.round(h * maxSize/w); w = maxSize; }
        else if(h > maxSize){ w = Math.round(w * maxSize/h); h = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

          <div><img src="${photos[4]}" /><div class="sub" style="text-align:center;">Semana 4</div></div>
        </div>
      ` : ''}
    `;
    document.getElementById('back-btn').onclick = ()=>{ state.view='dashboard'; render(); };
    const grid = document.getElementById('photos-grid');
    const shared = state.data.photosShared || {};
    [1,2,3,4].forEach(week=>{
      const cell = document.createElement('div');
      cell.className = 'photo-cell';
      if(photos[week]){
        const isShared = !!shared[week];
        cell.innerHTML = `
          <img src="${photos[week]}" data-viewphoto="${week}" />
          <div class="sub" style="text-align:center; margin-top:4px;">Semana ${week}</div>
          <button class="link-btn photo-replace-btn" data-week="${week}" style="font-size:11px;">Reemplazar</button>
          <label style="display:flex; align-items:center; gap:6px; margin-top:8px; font-size:10px; color:var(--text-muted); text-align:left;">
            <input type="checkbox" class="photo-share-check" data-week="${week}" ${isShared ? 'checked' : ''} style="margin:0;" />
            ¿Compartir con Russ?
          </label>
        `;
      } else {
        cell.innerHTML = `
          <label class="photo-add-btn">
            <span style="font-size:24px;">＋</span>
            <span style="font-size:11px; font-weight:600;">Semana ${week}</span>
            <input type="file" accept="image/*" capture="environment" class="photo-input" data-week="${week}" style="display:none;" />
          </label>
        `;
      }
      grid.appendChild(cell);
    });
    grid.querySelectorAll('.photo-share-check').forEach(chk=>{
      chk.onchange = async ()=>{
        state.data.photosShared[chk.dataset.week] = chk.checked;
        await saveParticipante(state.codigo, state.nombre, state.data);
      };
    });
    grid.querySelectorAll('.photo-input').forEach(input=>{
      input.onchange = async (e)=>{
        const file = e.target.files[0];
        if(!file) return;
        const compressed = await compressImage(file, 700);
        state.data.photos[input.dataset.week] = compressed;
        await saveParticipante(state.codigo, state.nombre, state.data);
        render();
      };
    });
    grid.querySelectorAll('.photo-replace-btn').forEach(btn=>{
      btn.onclick = ()=>{
        const input = document.createElement('input');
        input.type = 'file'; input.accept = 'image/*'; input.capture = 'environment';
        input.onchange = async (e)=>{
          const file = e.target.files[0];
          if(!file) return;
          const compressed = await compressImage(file, 700);
          state.data.photos[btn.dataset.week] = compressed;
          await saveParticipante(state.codigo, state.nombre, state.data);
          render();
        };
        input.click();
      };
    });
    grid.querySelectorAll('[data-viewphoto]').forEach(img=>{
      img.onclick = ()=>{
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;';
        overlay.innerHTML = `<img src="${img.src}" style="max-width:100%; max-height:100%; border-radius:10px;" />`;
        overlay.onclick = ()=> overlay.remove();
        document.body.appendChild(overlay);
      };
    });
    return;
  }

  if(state.view === 'sos'){
    app.innerHTML = `
      <button class="back" id="back-btn">&larr; Volver</button>
      <div class="brand-header">
        <div class="brand-kicker">NUTRIRETO</div>
        <div class="brand-title">SUMA20</div>
      </div>
      <div class="card" style="text-align:center;">
        <div style="font-size:36px; margin-bottom:6px;">🚨</div>
        <h1 style="text-align:center;">Clase 911</h1>
        <p class="sub">Una clase premium de 20 minutos, guiada por tu entrenadora, para retomar el ritmo. Un tropiezo no significa abandonar.</p>
        <div class="sos-player" id="sos-player">
          <div class="sos-player-badge">🔴 EN VIVO</div>
          <button class="sos-play-btn" id="sos-play-btn">▶</button>
          <div class="sos-player-info">
            <div class="sos-player-title">Clase 911 · Reenganche total</div>
            <div class="sos-player-sub">20:00 · Con tu entrenadora</div>
          </div>
        </div>
      </div>
    `;
    document.getElementById('back-btn').onclick = ()=>{ state.view='dashboard'; render(); };
    document.getElementById('sos-play-btn').onclick = ()=>{
      const player = document.getElementById('sos-player');
      const btn = document.getElementById('sos-play-btn');
      player.classList.toggle('playing');
      btn.textContent = player.classList.contains('playing') ? '❚❚' : '▶';
    };
    return;
  }

  if(state.view === 'admin-loading'){
    app.innerHTML = `
      <div class="brand-header">
        <div class="brand-kicker">NUTRIRETO</div>
        <div class="brand-title">SUMA20</div>
      </div>
      <p class="sub" style="text-align:center;">Cargando participantes...</p>
    `;
    return;
  }

  if(state.view === 'admin-panel'){
    const all = state.adminData || [];
    const today = todayISO();
    const withStats = all.map(p=>{
      const completed = completedCount(p.data);
      const lastAct = lastActivityDate(p.data);
      const daysSince = daysSinceISO(lastAct);
      return { ...p, completed, lastAct, daysSince };
    });
    const totalParticipantes = withStats.length;
    const promedioAvance = totalParticipantes ? Math.round(withStats.reduce((s,p)=>s+p.completed,0)/totalParticipantes) : 0;
    const terminaron = withStats.filter(p=>p.completed >= 30).length;
    const sinFirmar = withStats.filter(p=>!p.data.compromisoFirmado);
    const abandonando = withStats.filter(p=>p.completed < 30 && (p.daysSince === null || p.daysSince >= 3));
    const comentariosPendientes = [];
    withStats.forEach(p=>{
      Object.keys(p.data.exercises||{}).forEach(k=>{
        (p.data.exercises[k]||[]).forEach(e=>{
          if(e.comment && !e.respondido) comentariosPendientes.push({ participante:p, ejercicio:k, entry:e });
        });
      });
    });
    comentariosPendientes.sort((a,b)=> (b.entry.ts||'').localeCompare(a.entry.ts||''));
    const ordenados = [...withStats].sort((a,b)=> b.completed - a.completed);

    app.innerHTML = `
      <div class="topbar">
        <div>
          <div class="brand-kicker">NUTRIRETO</div>
          <div class="brand-title" style="font-size:20px;">Panel</div>
        </div>
        <button class="link-btn" id="admin-exit-btn">Salir</button>
      </div>

      <div class="admin-stat-grid">
        <div class="admin-stat-card"><div class="admin-stat-num">${totalParticipantes}</div><div class="admin-stat-label">PARTICIPANTES</div></div>
        <div class="admin-stat-card"><div class="admin-stat-num">${promedioAvance}/30</div><div class="admin-stat-label">AVANCE PROMEDIO</div></div>
        <div class="admin-stat-card"><div class="admin-stat-num">${terminaron}</div><div class="admin-stat-label">TERMINARON EL RETO</div></div>
        <div class="admin-stat-card"><div class="admin-stat-num">${sinFirmar.length}</div><div class="admin-stat-label">SIN FIRMAR COMPROMISO</div></div>
      </div>

      ${abandonando.length ? `
        <div class="admin-section-title">🚨 Riesgo de abandono (${abandonando.length})</div>
        <div id="admin-abandono"></div>
      ` : ''}

      ${comentariosPendientes.length ? `
        <div class="admin-section-title">💬 Comentarios pendientes (${comentariosPendientes.length})</div>
        <div id="admin-comentarios"></div>
      ` : ''}

      ${sinFirmar.length ? `
        <div class="admin-section-title">✍️ Sin firmar compromiso (${sinFirmar.length})</div>
        <div id="admin-sinfirmar"></div>
      ` : ''}

      <div class="admin-section-title">📖 Historial de alumnas confirmadas (${(state.historial||[]).length})</div>
      <div id="admin-historial"></div>
      <button class="btn-ghost" id="historial-add-btn" style="width:100%; margin-bottom:10px;">+ Agregar alumna al historial</button>
      <div id="historial-form" class="hidden card">
        <label>Nombre</label>
        <input type="text" id="hist-nombre" placeholder="Ej: Yanzivi Berrios" />
        <label>Edad</label>
        <input type="text" id="hist-edad" placeholder="Ej: 25" />
        <label>Duración de entrenamiento preferida</label>
        <input type="text" id="hist-duracion" placeholder="Ej: 45 min" />
        <label>Notas / restricciones</label>
        <input type="text" id="hist-notas" placeholder="Ej: Evitar peso muerto (protrusión discal)" />
        <button class="btn-primary" id="hist-save-btn" style="margin-top:8px;">Guardar</button>
      </div>

      <div class="admin-section-title">📋 Todas las participantes</div>
      <div id="admin-lista"></div>
    `;
    document.getElementById('admin-exit-btn').onclick = ()=>{ state.view='login'; state.adminData=null; render(); };
    document.getElementById('historial-add-btn').onclick = ()=>{
      document.getElementById('historial-form').classList.toggle('hidden');
    };
    document.getElementById('hist-save-btn').onclick = async ()=>{
      const nombre = document.getElementById('hist-nombre').value.trim();
      const edad = document.getElementById('hist-edad').value.trim();
      const duracion = document.getElementById('hist-duracion').value.trim();
      const notas = document.getElementById('hist-notas').value.trim();
      if(!nombre) return;
      state.historial = state.historial || [];
      state.historial.push({ nombre, edad, duracion, notas, fecha: todayISO() });
      await saveHistorial(state.historial);
      render();
    };
    const histC = document.getElementById('admin-historial');
    (state.historial||[]).forEach((h, hi)=>{
      const box = document.createElement('div');
      box.className = 'admin-row';
      box.innerHTML = `
        <div class="admin-row-name">${escapeHtml(h.nombre)}${h.edad ? ' · ' + escapeHtml(h.edad) + ' años' : ''}</div>
        <div class="admin-row-sub">${h.duracion ? 'Entrena ' + escapeHtml(h.duracion) : ''}</div>
        ${h.notas ? `<div class="admin-comment-box">⚠️ ${escapeHtml(h.notas)}</div>` : ''}
      `;
      histC.appendChild(box);
    });

    function renderParticipantRow(container, p, opts){
      const pct = Math.round((p.completed/30)*100);
      const row = document.createElement('div');
      row.className = 'admin-row' + (opts && opts.warn ? ' warn' : '') + (p.completed>=30 ? ' done' : '');
      row.innerHTML = `
        <div class="admin-row-name">${escapeHtml(p.nombre)}</div>
        <div class="admin-row-sub">${p.completed}/30 días${p.daysSince !== null ? ' · Última actividad hace ' + p.daysSince + ' día' + (p.daysSince===1?'':'s') : ' · Sin actividad todavía'}</div>
        <div class="admin-progress-mini"><div class="admin-progress-mini-fill" style="width:${pct}%;"></div></div>
      `;
      row.onclick = ()=>{ state.adminSelected = p.id; state.view = 'admin-detail'; render(); };
      container.appendChild(row);
    }

    if(abandonando.length){
      const c = document.getElementById('admin-abandono');
      abandonando.forEach(p=> renderParticipantRow(c, p, {warn:true}));
    }
    if(comentariosPendientes.length){
      const c = document.getElementById('admin-comentarios');
      comentariosPendientes.forEach(({participante,ejercicio,entry})=>{
        const box = document.createElement('div');
        box.className = 'admin-row warn';
        box.innerHTML = `
          <div class="admin-row-name">${escapeHtml(participante.nombre)}</div>
          <div class="admin-row-sub">${escapeHtml(ejercicio)} · ${formatDateAdmin(entry.date)}</div>
          <div class="admin-comment-box">💬 ${escapeHtml(entry.comment)}</div>
          <button class="btn-ghost admin-mark-btn" data-id="${participante.id}" data-ex="${escapeHtml(ejercicio)}" data-ts="${escapeHtml(entry.ts||'')}" style="margin-top:8px; padding:6px 12px; font-size:11px;">✓ Marcar como visto</button>
        `;
        c.appendChild(box);
      });
      c.querySelectorAll('.admin-mark-btn').forEach(btn=>{
        btn.onclick = async (ev)=>{
          ev.stopPropagation();
          await markCommentSeen(btn.dataset.id, btn.dataset.ex, btn.dataset.ts);
          render();
        };
      });
    }
    if(sinFirmar.length){
      const c = document.getElementById('admin-sinfirmar');
      sinFirmar.forEach(p=> renderParticipantRow(c, p));
    }
    const listaC = document.getElementById('admin-lista');
    ordenados.forEach(p=> renderParticipantRow(listaC, p));
    return;
  }

  if(state.view === 'admin-detail'){
    const p = (state.adminData||[]).find(x=>x.id === state.adminSelected);
    if(!p){ state.view='admin-panel'; render(); return; }
    const completed = completedCount(p.data);
    const sharedPhotos = Object.keys(p.data.photosShared || {}).filter(w=> p.data.photosShared[w] && p.data.photos && p.data.photos[w]);
    app.innerHTML = `
      <button class="back" id="back-btn">&larr; Volver</button>
      <div class="brand-header">
        <div class="brand-kicker">NUTRIRETO</div>
        <div class="brand-title" style="font-size:20px;">${escapeHtml(p.nombre)}</div>
      </div>
      <p class="sub" style="text-align:center;">${completed}/30 días · Compromiso: ${p.data.compromisoFirmado ? '✅ firmado' : '❌ sin firmar'}</p>
      ${sharedPhotos.length ? `
        <div class="admin-section-title">📸 Fotos compartidas con vos</div>
        <div class="photos-grid" id="admin-shared-photos"></div>
      ` : ''}
      <div id="admin-detail-days"></div>
    `;
    document.getElementById('back-btn').onclick = ()=>{ state.view='admin-panel'; render(); };
    if(sharedPhotos.length){
      const photosC = document.getElementById('admin-shared-photos');
      sharedPhotos.sort((a,b)=>a-b).forEach(week=>{
        const cell = document.createElement('div');
        cell.className = 'photo-cell';
        cell.innerHTML = `<img src="${p.data.photos[week]}" /><div class="sub" style="text-align:center; margin-top:4px;">Semana ${week}</div>`;
        photosC.appendChild(cell);
      });
    }
    const wrap = document.getElementById('admin-detail-days');
    for(let d=1; d<=30; d++){
      const info = dayInfo(d);
      if(!info) continue;
      const done = isDayDone(p.data, d);
      const box = document.createElement('div');
      box.className = 'admin-row' + (done ? ' done' : '');
      let entriesHtml = '';
      const exNames = info.tipo === 'circuito' ? info.ejercicios.map(e=>e.ejercicio) : (info.items||[]).filter(it=>it.ejercicio).map(it=>it.ejercicio);
      exNames.forEach(exName=>{
        const key = d + ':' + exName;
        const entries = p.data.exercises[key] || [];
        if(entries.length){
          const last = entries[entries.length-1];
          entriesHtml += `<div class="admin-comment-box" style="margin-top:4px;">${escapeHtml(exName)}: ${escapeHtml(last.reps||'')}${last.feeling ? ' · ' + escapeHtml(last.feeling) : ''}${last.comment ? '<br/>💬 ' + escapeHtml(last.comment) : ''}</div>`;
        }
      });
      box.innerHTML = `<div class="admin-row-name">Día ${d} ${done ? '✓' : ''}</div>${entriesHtml}`;
      wrap.appendChild(box);
    }
    return;
  }

  if(state.view === 'day'){
    const d = state.selectedDay;
    const info = dayInfo(d);
    const data = state.data;

    if(info.tipo === 'amorpropio' || info.tipo === 'reflexion' || info.tipo === 'cierre'){
      const reto = info.tipo === 'amorpropio' ? AMORPROPIO_RETOS[d % AMORPROPIO_RETOS.length] : null;
      const isDone = isDayDone(data, d);
      app.innerHTML = `
        <button class="back" id="back-btn">&larr; Volver</button>
        <div class="brand-header">
          <div class="brand-kicker">NUTRIRETO</div>
          <div class="brand-title">SUMA20</div>
        </div>
        <h1 style="text-align:center;">Día ${d} — ${escapeHtml(info.titulo)}</h1>
        <div class="card" style="text-align:center;">
          ${reto ? `<div class="tip" style="text-align:left;">🌸 ${escapeHtml(reto)}</div>` : `<p class="sub">Espacio libre — usalo para descansar y prepararte para lo que viene.</p>`}
          <button class="btn-primary" id="mark-done-btn" ${isDone?'disabled':''}>${isDone ? '✓ Ya lo marcaste' : 'Marcar como hecho ✓'}</button>
        </div>
      `;
      document.getElementById('back-btn').onclick = ()=>{ state.view='dashboard'; render(); };
      if(!isDone){
        document.getElementById('mark-done-btn').onclick = async ()=>{
          data.completados['dia'+d] = { done:true, date:todayISO() };
          await saveParticipante(state.codigo, state.nombre, data);
          state.view = 'day-complete';
          render();
        };
      }
      return;
    }

    let html = `
      <button class="back" id="back-btn">&larr; Volver</button>
      <div class="brand-header">
        <div class="brand-kicker">NUTRIRETO</div>
        <div class="brand-title">SUMA20</div>
      </div>
      <h1 style="text-align:center;">Día ${d} — ${escapeHtml(info.titulo)}</h1>
      ${state.uiRestAlert ? `<div class="rest-alert-banner">${escapeHtml(state.uiRestAlert.message)}</div>` : ''}
      <div id="day-items"></div>
    `;
    app.innerHTML = html;
    document.getElementById('back-btn').onclick = ()=>{ state.view='dashboard'; render(); };
    const restingKeys = Object.keys(state.uiResting);
    if(restingKeys.length){
      const rKey = restingKeys[0];
      const overlay = document.createElement('div');
      overlay.className = 'rest-overlay' + (state.uiResting[rKey] <= 10 ? ' blinking' : '');
      overlay.innerHTML = `
        <div class="rest-overlay-label">Descanso</div>
        <div class="rest-overlay-time">${state.uiResting[rKey]}</div>
        <button class="rest-overlay-cancel" id="rest-cancel-btn">Cancelar</button>
      `;
      document.body.appendChild(overlay);
      document.getElementById('rest-cancel-btn').onclick = ()=>{ cancelRestTimer(rKey); overlay.remove(); };
    }

    const wrap = document.getElementById('day-items');
    info.items.forEach((item, idx)=>{
      const key = d + ':' + item.ejercicio;
      const entries = data.exercises[key] || [];
      const lastToday = entries.find(e=>e.date === todayISO());
      const setsTarget = (item.series.match(/\d+/) || [null])[0];
      const setsDone = state.uiSets[key] !== undefined ? state.uiSets[key] : 0;
      const selectedFeeling = state.uiFeeling[key];

      const card = document.createElement('div');
      card.className = 'card';
      if(lastToday){
        card.innerHTML = `
          <div style="font-weight:700; font-size:18px; color:var(--pink); margin-bottom:2px;">${escapeHtml(item.ejercicio)}</div>
          <div class="sub" style="margin:4px 0 0;">✓ Ya registrado hoy — ${lastToday.reps} × ${lastToday.sets}${lastToday.feeling ? ' · ' + lastToday.feeling : ''}</div>
        `;
      } else {
        const resting = state.uiResting[key];
        card.innerHTML = `
          <div style="font-weight:700; font-size:18px; color:var(--pink); margin-bottom:2px;">${escapeHtml(item.ejercicio)}</div>
          <div class="sub" style="margin:2px 0 10px;">Objetivo: ${escapeHtml(item.series)} × ${escapeHtml(item.reps)} · ${escapeHtml(item.peso)}</div>
          ${item.video ? `
            <button class="video-btn" data-videotoggle="${key}">🎥 ${state.uiVideoOpen[key] ? 'Ocultar técnica' : 'Ver técnica'}</button>
            ${state.uiVideoOpen[key] ? `<div class="video-embed-wrap"><iframe src="${escapeHtml(youtubeEmbedUrl(item.video))}" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>` : ''}
          ` : ''}
          ${item.nota ? `<div class="tip">💡 <strong>Consejo técnico:</strong> ${escapeHtml(item.nota)}</div>` : ''}
          <div class="set-counter">
            <button class="set-minus" data-key="${key}">−</button>
            <span>${setsDone}${setsTarget ? ' / ' + setsTarget : ''} series</span>
            <button class="set-plus" data-key="${key}">+</button>
          </div>
          ${item.descanso ? (
            resting !== undefined ? '' : `
              <button class="btn-ghost rest-start-btn" data-key="${key}" data-seconds="${firstNumberSecs(item.descanso)}">⏱️ Iniciar descanso (${escapeHtml(item.descanso)})</button>
            `
          ) : ''}
          <div class="feeling-row">
            ${FEELINGS.map(f=>`<button class="feeling-btn${selectedFeeling===f?' selected':''}" data-key="${key}" data-feeling="${f}">${f}</button>`).join('')}
          </div>
          <label style="display:block; font-size:11px; font-weight:600; color:var(--text-muted); margin:8px 0 4px;">📝 Nota para tu entrenadora (opcional)</label>
          <input type="text" id="comment-${key}" value="${escapeHtml(state.uiComment[key] || '')}" placeholder="Ej: me costó, ¿bajo el peso?" />
          <button class="btn-primary registrar-btn" data-key="${key}" data-exercise="${escapeHtml(item.ejercicio)}" data-reps="${escapeHtml(item.reps)}" style="margin-top:8px;">Registrar</button>
        `;
      }
      wrap.appendChild(card);
    });

    wrap.querySelectorAll('.rest-start-btn').forEach(btn=>{
      btn.onclick = ()=>{ startRestTimer(btn.dataset.key, Number(btn.dataset.seconds)); };
    });
    wrap.querySelectorAll('[data-videotoggle]').forEach(btn=>{
      btn.onclick = ()=>{
        const k = btn.dataset.videotoggle;
        if(state.uiVideoOpen[k]) delete state.uiVideoOpen[k];
        else state.uiVideoOpen[k] = true;
        render();
      };
    });
    wrap.querySelectorAll('.set-plus').forEach(btn=>{
      btn.onclick = ()=>{ const k=btn.dataset.key; state.uiSets[k]=(state.uiSets[k]||0)+1; render(); };
    });
    wrap.querySelectorAll('.set-minus').forEach(btn=>{
      btn.onclick = ()=>{ const k=btn.dataset.key; state.uiSets[k]=Math.max(0,(state.uiSets[k]||0)-1); render(); };
    });
    wrap.querySelectorAll('.feeling-btn').forEach(btn=>{
      btn.onclick = ()=>{ state.uiFeeling[btn.dataset.key]=btn.dataset.feeling; render(); };
    });
    wrap.querySelectorAll('[id^=comment-]').forEach(inp=>{
      inp.oninput = ()=>{ state.uiComment[inp.id.replace('comment-','')] = inp.value; };
    });
    wrap.querySelectorAll('.registrar-btn').forEach(btn=>{
      btn.onclick = async ()=>{
        const key = btn.dataset.key;
        const entry = { date: todayISO(), ts: new Date().toISOString(), reps: btn.dataset.reps, sets: state.uiSets[key]||0, feeling: state.uiFeeling[key]||'' };
        if(state.uiComment[key] && state.uiComment[key].trim()) entry.comment = state.uiComment[key].trim();
        if(!data.exercises[key]) data.exercises[key] = [];
        data.exercises[key].push(entry);
        delete state.uiSets[key];
        delete state.uiFeeling[key];
        delete state.uiComment[key];
        await saveParticipante(state.codigo, state.nombre, data);
        if(isDayDone(data, d)){ state.view = 'day-complete'; }
        render();
      };
    });
    return;
  }
}

async function onLogin(){
  const codigo = document.getElementById('in-codigo').value.trim();
  const nombre = document.getElementById('in-nombre').value.trim();
  const err = document.getElementById('login-error');
  if(!codigo || !nombre){
    err.textContent = 'Completá el código y tu nombre.';
    err.classList.remove('hidden');
    return;
  }
  if(nombre.toLowerCase() === 'panelruss'){
    err.classList.add('hidden');
    state.view = 'admin-loading';
    render();
    await loadAdminData();
    state.view = 'admin-panel';
    render();
    return;
  }
  if(codigo.toUpperCase() !== ACCESS_CODE.toUpperCase()){
    err.textContent = 'Código incorrecto. Revisá con tu entrenadora.';
    err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  state.codigo = codigo;
  state.nombre = nombre;
  state.data = await loadParticipante(codigo, nombre);
  state.view = state.data.compromisoFirmado ? 'dashboard' : 'compromiso';
  render();
}

function setupSignaturePad(){
  const canvas = document.getElementById('signature-pad');
  const ratio = window.devicePixelRatio || 1;
  canvas.width = canvas.offsetWidth * ratio;
  canvas.height = canvas.offsetHeight * ratio;
  const ctx = canvas.getContext('2d');
  ctx.scale(ratio, ratio);
  ctx.strokeStyle = '#c2186b';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  state.sigCtx = ctx;
  state.sigHasContent = false;

  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }
  function start(e){ e.preventDefault(); state.sigDrawing = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); }
  function move(e){
    if(!state.sigDrawing) return;
    e.preventDefault();
    const p = pos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.sigHasContent = true;
  }
  function end(){ state.sigDrawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
}
function clearSignature(){
  const canvas = document.getElementById('signature-pad');
  const ctx = state.sigCtx;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  state.sigHasContent = false;
}
async function onConfirmCompromiso(){
  if(!state.sigHasContent){
    document.getElementById('sig-error').classList.remove('hidden');
    return;
  }
  document.getElementById('sig-error').classList.add('hidden');
  state.data.compromisoFirmado = true;
  await saveParticipante(state.codigo, state.nombre, state.data);
  fireConfetti();
  setTimeout(()=>{ state.view = 'dashboard'; render(); }, 900);
}

function fireConfetti(){
  const canvas = document.getElementById('confetti-overlay');
  canvas.classList.remove('hidden');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const colors = ['#3f6b3f','#c2186b','#ef9f27','#f3f0e6'];
  const particles = [];
  for(let i=0;i<60;i++){
    particles.push({
      x: canvas.width/2, y: canvas.height/2,
      vx: (Math.random()-0.5)*14,
      vy: (Math.random()-0.9)*14,
      size: 4+Math.random()*4,
      color: colors[Math.floor(Math.random()*colors.length)],
      life: 60
    });
  }
  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.vy += 0.4; p.life--;
      ctx.globalAlpha = Math.max(p.life/60, 0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, p.size, p.size);
    });
    if(frame < 60) requestAnimationFrame(tick);
    else canvas.classList.add('hidden');
  }
  tick();
}

render();
</script>
